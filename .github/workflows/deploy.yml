name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/copy-lint.mjs
      - run: node scripts/domain-check.mjs
      - run: node scripts/share-payload-check.mjs
      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.onecurrentapp.com
          # EXPO_PUBLIC_SHOW_TESTING is deliberately NOT set here. With it on,
          # anyone who opens the site unlocks Pro for their own browser and can
          # move the app's clock — harmless while nothing was for sale, but the
          # Pro gates stop being gates, and Pro now carries the long view
          # (curves, the fortnight trend, the running totals). Local builds
          # still get the Testing card: `EXPO_PUBLIC_SHOW_TESTING=1 npm run web`.
      - run: node scripts/inject-head.mjs dist/index.html
      - name: Deploy
        # --branch is REQUIRED here, not optional. actions/checkout leaves a
        # detached HEAD, so wrangler cannot infer the branch and every upload
        # lands as a PREVIEW deployment on a hash-prefixed pages.dev URL —
        # the run goes green while app.onecurrentapp.com keeps serving an old
        # build. Pages only promotes a deployment whose branch matches the
        # project's production branch.
        run: npx wrangler pages deploy dist --project-name=one-current-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
