name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/copy-lint.mjs
      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.onecurrentapp.com
      - run: node scripts/inject-head.mjs dist/index.html
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name=one-current-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
