name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/copy-lint.mjs
      - run: node scripts/domain-check.mjs
      - run: node scripts/share-payload-check.mjs
      - name: Export web build
        # --clear because EXPO_PUBLIC_* values are inlined at transform time
        # and Metro will happily serve a cached transform carrying the PREVIOUS
        # value. The bundle then looks right (the strings are always present)
        # while the flag itself is stale — which is exactly the failure mode
        # toggling SHOW_TESTING invites.
        run: npx expo export --platform web --clear
        env:
          EXPO_PUBLIC_API_URL: https://api.onecurrentapp.com
          # Testing card ON in production, asked for deliberately so the live
          # build can be exercised the way a local one is (Pro unlock, clock
          # skew, fill the charge, always drop tokens).
          #
          # What it means while it is on, all of it reversible by deleting
          # this one line:
          #   · anyone who opens the site can unlock Pro for THEIR OWN browser
          #     and move the app's clock. Nothing leaves the device and no
          #     other account is touched — but the Pro gates (creature themes,
          #     the psychologist share, the long view) stop being gates.
          #   · the client-side refusal to follow a stub checkout is disarmed:
          #     that guard is `!SHOW_TESTING`, so with this set a server
          #     offering `mode: "stub"` would be followed. The API 404s its dev
          #     endpoint in production, so this is belt-and-braces rather than
          #     the only thing standing there — but the braces are off.
          EXPO_PUBLIC_SHOW_TESTING: "1"
      - run: node scripts/inject-head.mjs dist/index.html
      - name: Deploy
        # --branch is REQUIRED here, not optional. actions/checkout leaves a
        # detached HEAD, so wrangler cannot infer the branch and every upload
        # lands as a PREVIEW deployment on a hash-prefixed pages.dev URL —
        # the run goes green while app.onecurrentapp.com keeps serving an old
        # build. Pages only promotes a deployment whose branch matches the
        # project's production branch.
        run: npx wrangler pages deploy dist --project-name=one-current-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
